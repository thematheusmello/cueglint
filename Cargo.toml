[workspace]
members = ["crates/cueglint-core", "crates/cueglint-cli", "crates/cueglint", "crates/cueglint-local", "crates/cueglint-providers", "xtask", "vendor/eframe", "vendor/egui-wgpu"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thematheusmello/cueglint"

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland", "persistence"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
same-file = "1.0.6"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

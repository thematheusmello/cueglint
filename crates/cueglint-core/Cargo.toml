[package]
name = "cueglint-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
url = "=2.5.8"
sha2.workspace = true
quick-xml = { version = "=0.41.0", default-features = false }
zip = { version = "=9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
lopdf = { version = "=0.47.0", default-features = false }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

[[test]]
name = "pdf_supervision"
harness = false

[package]
name = "cueglint-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cueglint-core = { path = "../cueglint-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image.workspace = true
uuid.workspace = true
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
cpal = "=0.18.2"
hound = "3.5"
ureq = { version = "=3.2.0", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.1.2", features = ["macos_15_0"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-av-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGDirectDisplay"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com_StructuredStorage", "Win32_System_Performance", "Win32_System_Variant"] }

[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

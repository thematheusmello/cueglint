[package]
name = "cueglint-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "=0.22.1"
cueglint-core = { path = "../cueglint-core" }
getrandom = "=0.4.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "=2.5.8"
zeroize = "=1.9.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "net", "sync", "io-util"] }
futures-util = "=0.3.34"

[dev-dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

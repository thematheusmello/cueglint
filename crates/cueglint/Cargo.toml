[package]
name = "cueglint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cueglint-local = { path = "../cueglint-local" }
anyhow.workspace = true
cueglint-core = { path = "../cueglint-core" }
eframe.workspace = true
image.workspace = true
uuid.workspace = true
pulldown-cmark = { version = "=0.13.6", default-features = false }
url = "=2.5.8"
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "=0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

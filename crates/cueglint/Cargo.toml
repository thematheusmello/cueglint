[package]
name = "cueglint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cueglint-local = { path = "../cueglint-local" }
cueglint-providers = { path = "../cueglint-providers" }
zeroize = "=1.9.1"
anyhow.workspace = true
cueglint-core = { path = "../cueglint-core" }
eframe.workspace = true
image.workspace = true
uuid.workspace = true
pulldown-cmark = { version = "=0.13.6", default-features = false }
url = "=2.5.8"
serde_json.workspace = true
sha2.workspace = true
skrifa = "=0.42.1"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "=0.10.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSFont", "NSFontDescriptor", "objc2-core-foundation"] }
core-foundation = "=0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

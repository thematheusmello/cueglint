name: macOS arm64 development package
"on":
  workflow_dispatch:
    inputs:
      public_dev3:
        description: Verify the downloadable dev.3 archive
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-development-package-${{ github.ref }}-${{ inputs.public_dev3 }}
  cancel-in-progress: true
jobs:
  package:
    if: github.ref == 'refs/heads/main' || inputs.public_dev3
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE_NAME: cueglint-macos-arm64-dev-${{ github.sha }}.zip
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.1
        if: ${{ !inputs.public_dev3 }}
      - name: Verify the arm64 Metal toolchain
        if: ${{ !inputs.public_dev3 }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          printf 'macOS SDK %s\n' "$sdk"
          test "${sdk%%.*}" -ge 26
          swift=$(xcrun --find swift)
          "$swift" --version
          bin=${swift%/*}
          sdk_root=$(xcrun --sdk macosx --show-sdk-path)
          printf '#include <stdio.h>\n' | PATH="$bin:$PATH" SDKROOT="$sdk_root" cc -x c -fsyntax-only -
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          printf 'SDKROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Build the development package
        if: ${{ !inputs.public_dev3 }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cueglint-package-target
          CARGO_BUILD_JOBS: "2"
        run: cargo xtask package
      - name: Archive the development build
        if: ${{ !inputs.public_dev3 }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cueglint-development-package"
          mkdir -p "$output"
          ditto -c -k --sequesterRsrc --keepParent dist "$output/$ARCHIVE_NAME"
          (
            cd "$output"
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          )
      - name: Download both public dev.3 assets and verify their pins
        if: inputs.public_dev3
        run: |
          set -euo pipefail
          record="$PWD/parity/reports/hosted-macos-arm64-development-005.json"
          source_sha=$(jq -er '.source_commit' "$record")
          archive="cueglint-macos-arm64-dev-$source_sha.zip"
          output="$RUNNER_TEMP/cueglint-development-package"
          mkdir "$output"
          cd "$output"
          for asset in "$archive" "$archive.sha256"; do
            curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 --max-time 120 \
              "https://github.com/thematheusmello/cueglint/releases/download/v0.1.0-dev.3/$asset" -o "$asset"
          done
          digest=$(jq -er '.archive.archive.sha256' "$record")
          checksum_digest=$(jq -er '.archive.checksum_asset.sha256' "$record")
          printf '%s  %s\n' "$digest" "$archive" "$checksum_digest" "$archive.sha256" | shasum -a 256 -c -
          printf 'ARCHIVE_NAME=%s\nPACKAGE_SOURCE_COMMIT=%s\nPACKAGE_ARCHIVE_SHA256=%s\n' \
            "$archive" "$source_sha" "$digest" >> "$GITHUB_ENV"
      - name: Verify the extracted package
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/cueglint-development-package"
          roundtrip="$RUNNER_TEMP/cueglint-package-roundtrip"
          mkdir -p "$roundtrip"
          (cd "$output" && shasum -a 256 -c "$ARCHIVE_NAME.sha256")
          ditto -x -k "$output/$ARCHIVE_NAME" "$roundtrip"
          (
            cd "$roundtrip/dist"
            shasum -a 256 -c SHA256SUMS
            for binary in Cueglint.app/Contents/MacOS/cueglint cueglint-cli; do
              test -x "$binary"
              test "$(lipo -archs "$binary")" = arm64
            done
            codesign --verify --deep --strict Cueglint.app
            codesign --verify --strict cueglint-cli
            for signed in Cueglint.app cueglint-cli; do
              codesign --display --verbose=4 "$signed" 2>&1 | grep -Fx 'Signature=adhoc'
            done
          )
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          dist = Path(os.environ["RUNNER_TEMP"]) / "cueglint-package-roundtrip/dist"
          if os.environ.get("PACKAGE_ARCHIVE_SHA256"):
              pin = json.loads(Path("parity/reports/hosted-macos-arm64-development-005.json").read_bytes())["archive"]
              source = (dist / "cueglint-cli.NOTICES/manifest.json").read_bytes()
              assert hashlib.sha256(source).hexdigest() == pin["manifest_sha256"]
              for name, identity in {**pin["binaries"], "SHA256SUMS": pin["checksum_file"]}.items():
                  data = (dist / name).read_bytes()
                  assert len(data) == identity["bytes"] and hashlib.sha256(data).hexdigest() == identity["sha256"], name
          else:
              source = Path("third-party/runtime/manifest.json").read_bytes()
          manifest = json.loads(source)
          payloads = {item["source_path"]: (item["sha256"], item["bytes"]) for item in manifest["files"]}
          payloads["manifest.json"] = (hashlib.sha256(source).hexdigest(), len(source))
          members = set(payloads)
          for name in payloads:
              members.update(str(parent) for parent in PurePosixPath(name).parents if str(parent) != ".")
          assert {path.name for path in dist.iterdir()} == {"Cueglint.app", "cueglint-cli", "cueglint-cli.NOTICES", "SHA256SUMS"}
          expected = {}
          for notice in ["Cueglint.app/Contents/Resources/THIRD_PARTY", "cueglint-cli.NOTICES"]:
              root = dist / notice
              assert root.is_dir() and not root.is_symlink()
              paths = list(root.rglob("*"))
              assert all(not path.is_symlink() and (path.is_file() or path.is_dir()) for path in paths)
              assert {path.relative_to(root).as_posix() for path in paths} == members
              for name, (digest, size) in payloads.items():
                  data = (root / name).read_bytes()
                  assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, name
                  expected[f"{notice}/{name}"] = digest
          for binary in ["Cueglint.app/Contents/MacOS/cueglint", "cueglint-cli"]:
              expected[binary] = hashlib.sha256((dist / binary).read_bytes()).hexdigest()
          checksums = {}
          for line in (dist / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split("  ", 1)
              assert name not in checksums, name
              checksums[name] = digest
          assert checksums == expected, "SHA256SUMS must cover exactly both binaries and both notice trees"
          PY
      - name: Verify the extracted app renders the original Calendar reminder
        timeout-minutes: 2
        run: |
          python3 .github/scripts/macos-package-fixture.py \
            "$RUNNER_TEMP/cueglint-package-roundtrip/dist/Cueglint.app/Contents/MacOS/cueglint" \
            "$RUNNER_TEMP/cueglint-package-fixture"
      - name: Retain the packaged fixture frame and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-packaged-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cueglint-package-fixture
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the verified development archive
        if: ${{ !inputs.public_dev3 }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-development-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cueglint-development-package/${{ env.ARCHIVE_NAME }}
            ${{ runner.temp }}/cueglint-development-package/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

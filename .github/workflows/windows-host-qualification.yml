name: Windows host qualification (no distribution)
"on":
  workflow_dispatch:
    inputs:
      qualification_source:
        description: Exact public source to qualify
        type: choice
        default: frozen
        options:
          - frozen
          - package-candidate
      gui_fixture:
        description: Run one original GUI fixture without capture or inference
        type: boolean
        default: false
      provenance_only:
        description: Verify the selected source graph and host tools before compilation
        type: boolean
        default: false
      link_calibration_only:
        description: Verify native linker member selection with an original two-member archive
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-host-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      QUALIFICATION_SOURCE_SET: ${{ inputs.qualification_source }}
      QUALIFICATION_SOURCE_REF: ${{ inputs.qualification_source == 'package-candidate' && '5a468a260a7b6a60dc478d5c139a6f524b8b4627' || 'e1f655617acfd5171cca0cfc25370f1128f6e362' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Set up isolated job paths and exact Git line endings
        run: |
          $key = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value @(
              "QUALIFICATION_OUT=$(Join-Path $env:RUNNER_TEMP "cueglint-windows-evidence-$key")"
              "QUALIFICATION_TARGET=$(Join-Path $env:RUNNER_TEMP "cueglint-windows-target-$key")"
          )
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot configure exact source checkout.' }
      - name: Check out the workflow controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qualification-controller
          persist-credentials: false
      - name: Check out the selected public source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_REF }}
          path: source
          persist-credentials: false
      - name: Parse the PowerShell scripts before execution
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'qualification-controller/.github/scripts/windows-host-qualification'
          foreach ($name in @('qualify.ps1', 'summarize.ps1', 'gui-fixture.ps1', 'link-calibration.ps1')) {
              $tokens = $null
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root $name), [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count) {
                  $parseErrors | Format-List
                  throw "PowerShell syntax failed: $name"
              }
              Write-Output "PowerShell syntax passed: $name"
          }
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Qualify tools and locked graph, with optional executable checks
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'qualification-controller/.github/scripts/windows-host-qualification/qualify.ps1'
          $guiFixture = '${{ inputs.gui_fixture }}' -eq 'true'
          $provenanceOnly = '${{ inputs.provenance_only }}' -eq 'true'
          $linkCalibrationOnly = '${{ inputs.link_calibration_only }}' -eq 'true'
          & $script -Repo (Join-Path $env:GITHUB_WORKSPACE 'source') -Out $env:QUALIFICATION_OUT -Target $env:QUALIFICATION_TARGET -SourceSet $env:QUALIFICATION_SOURCE_SET -GuiFixture:$guiFixture -ProvenanceOnly:$provenanceOnly -LinkCalibrationOnly:$linkCalibrationOnly
      - name: Retain bounded text evidence in job logs, including failures
        if: always()
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'qualification-controller/.github/scripts/windows-host-qualification/summarize.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
              Write-Output 'Qualification controller was not available; preceding step results are authoritative.'
              exit 0
          }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) {
              $parseErrors | Format-List
              throw 'Evidence summarizer syntax failed; preceding failures remain failures.'
          }
          & $script -Out $env:QUALIFICATION_OUT
      # Deliberately no upload-artifact, package, archive, signing or release step.

name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev libasound2-plugins libpulse-dev pulseaudio pulseaudio-utils
      - name: Check Windows evidence collectors
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.github/scripts/windows-host-qualification/test-evidence.ps1
          ./.github/scripts/windows-host-qualification/test-link-calibration.ps1
          ./.github/scripts/windows-host-qualification/test-product-link-maps.ps1
          ./.github/scripts/windows-host-qualification/test-product-link-map-wrapper.ps1
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - name: Capture the isolated Linux playback monitor
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          result=0
          .github/scripts/linux-monitor-fixture.sh || result=1
          for trial in 2 3 4 5; do
            echo "Independent playback on fresh isolated server $trial of 5"
            .github/scripts/linux-monitor-fixture.sh cold-clock || result=1
          done
          for trial in 1 2 3 4 5; do
            echo "Low-latency control on fresh no-rewind server $trial of 5"
            .github/scripts/linux-monitor-fixture.sh bounded-clock || result=1
          done
          for trial in 1 2 3; do
            echo "First-fragment native clock and retained backlog $trial of 3"
            .github/scripts/linux-monitor-fixture.sh native-clock || result=1
          done
          exit "$result"
      - name: Check paired local answer evidence
        if: runner.os == 'Linux'
        run: python3 .github/scripts/local-answer-grounding.py check
      - run: cargo xtask verify-registry
      - run: cargo xtask progress --check
      - name: Exercise the native Windows package gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inventory = Get-Content -Raw 'third-party/runtime/windows-x86_64-msvc/manifest.json' | ConvertFrom-Json
          if ($inventory.bundle_ready) {
            Write-Output 'The current inventory is adopted. Synthetic gate tests still cover blocked inputs.'
            exit 0
          }
          if ((Test-Path 'dist') -or (Test-Path 'target/windows-package')) {
            throw 'Expected a clean checkout for the Windows package gate.'
          }
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cargo xtask package 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Output $output
          if ($exit -eq 0 -or $output -notmatch 'notice inventory is not approved for distribution; remaining blockers:') {
            throw "The package command did not report the Windows notice gate (exit $exit)."
          }
          if ((Test-Path 'dist') -or (Test-Path 'target/windows-package')) {
            throw 'The Windows package gate allowed build or staging output.'
          }
          exit 0
      - name: Verify the native Windows credential round trip
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          CUEGLINT_TEST_WINDOWS_VAULT: '1'
          CARGO_TERM_COLOR: never
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cargo test --offline --locked -p cueglint-providers --lib credentials::tests::windows_native_credential_round_trip -- --ignored --exact --nocapture 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Output $output
          if ($exit -ne 0 -or $output -notmatch 'test result: ok\. 1 passed; 0 failed;') {
            throw "The exact Windows credential fixture did not pass (exit $exit)."
          }
          exit 0

name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - name: Linux native build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - run: cargo xtask verify-registry
      - run: cargo xtask progress --check
